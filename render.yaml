# Render Blueprint — Pharmacy Eid (Django + React)
# 1. Push repo to GitHub, then in Render: New → Blueprint → connect repo (select render.yaml)
# 2. Create a free PostgreSQL first, or add database via Blueprint below.

databases:
  - name: eid-pharmacy-db
    databaseName: eid_pharmacy
    user: eid_pharmacy
    plan: free

services:
  - type: web
    name: eid-pharmacy-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: USE_X_FORWARDED_PROTO
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: eid-pharmacy-db
          property: connectionString
      # Optional: restrict CORS if you host frontends elsewhere
      # - key: CORS_ALLOWED_ORIGINS
      #   value: https://eid-pharmacy-web.onrender.com
