# Render Blueprint — API-only (SaaS). Admin + POS on Vercel with VITE_API_URL → this service.
# Apply: Render Dashboard → New → Blueprint → connect repo.
# After first deploy, set CORS_ALLOWED_ORIGINS / CSRF_TRUSTED_ORIGINS to your Vercel URLs (Dashboard → Environment).
#
# Monolith (Django serves /admin/ + /app/ from built Vite apps): use Native Python, Root Directory = repo root,
# Build Command = pip install -r requirements.txt && bash build_frontends.sh , Start Command = python start_render.py .

databases:
  - name: eid-pharmacy-db
    databaseName: eid_pharmacy
    user: eid_pharmacy
    plan: free

services:
  - type: web
    name: eid-pharmacy-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: USE_X_FORWARDED_PROTO
        value: "true"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: eid-pharmacy-db
          property: connectionString
      # Required after you know Vercel URLs (comma-separated, no trailing slash on origins):
      # https://your-admin.vercel.app,https://your-pos.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # Neon / Supabase: keep default true; some local Postgres: false
      - key: DATABASE_SSL_REQUIRE
        value: "true"
